name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - name: Check the tag matches obj.version
        run: |
          version="$(grep -m1 '^obj.version' init.lua | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match obj.version ${version}" >&2
            exit 1
          fi
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install test tools
        run: luarocks install busted && luarocks install luacheck && luarocks install dkjson
      - name: Lint
        run: luacheck .
      - name: Test
        run: busted
      - name: Build
        run: bash tools/build-dist.sh dist-out
      - name: Publish the dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish="$(mktemp -d)"
          mkdir -p "${publish}/Spoons" "${publish}/docs"
          cp dist-out/DisplayKVM.spoon.zip "${publish}/Spoons/DisplayKVM.spoon.zip"
          cp dist-out/docs.json "${publish}/docs/docs.json"
          cd "${publish}"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Spoons/DisplayKVM.spoon.zip docs/docs.json
          git commit -q -m "publishes DisplayKVM ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist-out/DisplayKVM.spoon.zip
